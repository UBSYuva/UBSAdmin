<div class="width-full">

    <!-- Loader -->
    <div *ngIf="loading" class="loader-container">
        <div>
            <div class="loader"></div>
        </div>
    </div>

    <!-- Actions Bar -->
    <div class="card p-3 mb-2 border-0 shadow-sm bg-white">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-dark">Donation Reports</h5>
            <div class="d-flex align-items-center gap-3">
                <div *ngIf="userRole !== 'viewMembers' && userRole !== 'viewMembersPin' && userRole !== 'onlyView'" 
                    class="icon-style p-2 rounded bg-light hover-bg-gray" (click)="exportDonationPDF()"
                    title="Export to PDF">
                    <i class="bi bi-file-earmark-pdf text-danger"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="card p-2 mb-3 shadow-sm bg-white border-0">
        <div class="horizontal-submenu">
            <ul class="nav nav-pills gap-2">
                <li class="nav-item">
                    <a class="nav-link" routerLink="overview" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}">Overview</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="transactions" routerLinkActive="active">Transactions</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Content Area for Child Routes -->
    <div class="donation-content-area">
        <router-outlet></router-outlet>
    </div>
</div>
